<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>lil’ bright</title>
<link rel="icon" href="images/faviconlogo.png" sizes="32x32">
<link rel="icon" href="images/faviconlogo.png" sizes="48x48">
<link rel="apple-touch-icon" href="images/faviconlogo.png">
  
  <style>
    :root {
      --green-dark: #1f7a5c;   /* ロゴ・見出し */
      --green-main: #3fb68b;   /* アクセント */
      --green-light: #e8f6f1;  /* 背景用の淡い緑 */
      --white: #ffffff;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--white);
      color: #222;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
      background-color: var(--green-light);
    }

   .hero-logo img {
  width: 280px;   
  max-width: 80%;
  height: auto;
}

    header h1 {
      margin: 0;
      font-size: 3rem;
      color: var(--green-dark);
      letter-spacing: 0.03em;
    }

    .description {
      max-width: 640px;
      margin: 30px auto 0;
      font-size: 1.05rem;
      line-height: 1.9;
      color: #333;
    }

   main {
  max-width: 900px;
  margin: 60px auto;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

 .news-item {
  display: flex;
  gap: 16px;
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  padding: 14px;
  text-decoration: none;
  color: inherit;

  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

    
.news-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.12);
}

.news-item img {
  width: 180px;
  height: 120px;
  object-fit: cover;
  border-radius: 10px;
  flex-shrink: 0;
}

    .news-item .text {
  display: flex;
  flex-direction: column;
}

.news-item .title {
  font-size: 18px;
  line-height: 1.4;
  margin: 0 0 6px;
  color: #111;
}

.news-item .title a {
  color: var(--green-dark);
  text-decoration: none;
}

.news-item .title a:hover {
  text-decoration: underline;
}

.news-item .summary {
  font-size: 14px;
  color: #555;
  line-height: 1.6;
  margin: 0 0 10px;
}

.meta {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: #777;
  margin-top: auto;
}

.tag {
  background: #eef7f1;
  color: #2f7f5f;
  padding: 2px 8px;
  border-radius: 999px;
}

    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 0.85rem;
      color: #666;
      border-top: 1px solid #eee;
    }
  </style>
</head>

<body>
  <header>
     <a href="index.html">
    <img src="images/logo.png" alt="lil' bright ロゴ" class="hero-logo">
  </a>
    
   
  </p>
    <div class="description">
      暗いニュースで溢れたこの時代に、
      ポジティブなニュースだけを楽しみたい。<br>
      lil’ bright は、そんな人のためのニュースサイトです。<br><br>

      朝起きたとき。
      寝る前。
      ちょっと気分を上げたいとき。<br>
      lil’ bright は、そんな瞬間のためのニュースサイトです。
    </div>
  </header>

   <main id="newsList"></main>

  <footer>
    © 2026 lil’ bright
  </footer>

   <script>
   fetch('./articles.json')
      .then(response => response.json())
      .then(articles => {
        const newsList = document.getElementById('newsList');

        articles.forEach(article => {
          const item = document.createElement('a');
          item.href = article.url;
          item.className = 'news-item';

          item.innerHTML = `
            <img src="${article.image}" alt="${article.alt}">

            <div class="text">
              <h2 class="title">
                ${article.title}
              </h2>

              <p class="summary">
                ${article.summary}
              </p>

              <div class="meta">
                <span class="date">${article.date}</span>
                <span class="tag">${article.tag}</span>
              </div>
            </div>
          `;

          newsList.appendChild(item);
        });
      });
  </script>
</body>
</html>
