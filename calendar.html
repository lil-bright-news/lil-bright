<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日は何の日？ | lil' bright</title>
  <link rel="icon" href="images/faviconlogo.png" sizes="32x32">
  <link rel="icon" href="images/faviconlogo.png" sizes="48x48">
  <link rel="apple-touch-icon" href="images/faviconlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #4caf50;
      --green-dark: #2e7d32;
      --green-light: #e8f5e9;
      --dark: #111111;
      --white: #ffffff;
      --muted: #6b7280;
      --bg: #f9fafb;
      --border: #e5e7eb;
    }
    body { background: var(--bg); color: var(--dark); font-family: 'Noto Sans JP', sans-serif; }

    /* ヘッダー */
    .site-header { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 40px; height: 72px; display: flex; align-items: center; justify-content: center; }
    .site-header img { height: 72px; }

    /* ヒーロー */
    .hero { background: var(--dark); padding: 36px 24px; text-align: center; }
    .hero h1 { font-family: 'Lexend', sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--white); margin-bottom: 8px; }
    .hero p { font-size: 0.9rem; color: #9ca3af; }

    /* メイン */
    main { max-width: 860px; margin: 40px auto; padding: 0 20px 80px; }

    /* カレンダー */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .cal-header h2 { font-size: 1.2rem; font-weight: 700; color: var(--dark); }
    .nav-btn { background: var(--white); border: 0.5px solid var(--border); border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px; color: var(--dark); font-family: 'Noto Sans JP', sans-serif; transition: background 0.15s; }
    .nav-btn:hover { background: var(--bg); }

    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
    .weekday { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }

    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { min-height: 60px; border-radius: 10px; border: 0.5px solid var(--border); padding: 8px; cursor: pointer; background: var(--white); position: relative; transition: border-color 0.15s, box-shadow 0.15s; }
    .day:hover { border-color: var(--green); }
    .day.empty { background: none; border-color: transparent; cursor: default; }
    .day.today { border: 2px solid var(--green); }
    .dot-wrap { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-birthday { background: #4caf50; }
    .dot-history  { background: #1976d2; }
    .dot-anime    { background: #e91e63; }
    .dot-culture  { background: #f9a825; }
    .day.selected { background: var(--green-light); border-color: var(--green); }
    .day-num { font-size: 13px; color: var(--dark); }
    .day.today .day-num { font-weight: 700; color: var(--green-dark); }

    /* 詳細 */
    .detail { margin-top: 1.5rem; border-radius: 14px; border: 0.5px solid var(--border); background: var(--white); padding: 1.5rem; min-height: 100px; }
    .detail-date { font-size: 12px; color: var(--muted); margin-bottom: 12px; font-family: 'Lexend', sans-serif; letter-spacing: 0.05em; }
    .detail-empty { font-size: 14px; color: var(--muted); }

    .event-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
    .event-item:last-child { border-bottom: none; padding-bottom: 0; }
    .event-tag { font-size: 11px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; font-weight: 700; }
    .tag-birthday { background: #e8f5e9; color: #2e7d32; }
    .tag-history  { background: #e3f2fd; color: #1565c0; }
    .tag-anime    { background: #fce4ec; color: #c2185b; }
    .tag-culture  { background: #fff8e1; color: #e65100; }
    .event-title { font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
    .event-desc  { font-size: 13px; color: var(--muted); line-height: 1.7; }

    /* 凡例 */
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 1.2rem; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* フッター */
    footer { text-align: center; padding: 32px 20px; font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--border); }
    footer a { color: var(--green-dark); text-decoration: none; }
  </style>
</head>
<body>

<header class="site-header">
  <a href="index.html"><img src="images/logo.png" alt="lil' bright"></a>
</header>

<div class="hero">
  <h1>今日は何の日？</h1>
  <p>誕生日・歴史的な出来事・アニメの記念日など、ポジティブな記念日をお届け</p>
</div>

<main>
  <div class="cal-header">
    <button class="nav-btn" id="prev">← 前の月</button>
    <h2 id="month-title"></h2>
    <button class="nav-btn" id="next">次の月 →</button>
  </div>
  <div class="weekdays">
    <div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div>
    <div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div>
  </div>
  <div class="days" id="days"></div>

  <div class="detail" id="detail">
    <div class="detail-empty">日付をクリックすると記念日が表示されます</div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>誕生日</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1976d2"></div>歴史的な日</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e91e63"></div>アニメ・ゲーム</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f9a825"></div>文化・その他</div>
  </div>
</main>

<footer>
  © 2026 lil' bright &nbsp;|&nbsp; <a href="index.html">トップへ戻る</a>
</footer>

<script>
const EVENTS = {
  "1-1":  [{ tag:"history", label:"歴史", title:"元日", desc:"新年おめでとう！世界中で新しい年の始まりを祝う日。" }],
  "1-8":  [{ tag:"birthday", label:"誕生日", title:"デヴィッド・ボウイ (1947)", desc:"「スペース・オディティ」「ジギー・スターダスト」など時代を超えた名曲を残した音楽の革命児。" }],
  "1-14": [{ tag:"anime", label:"アニメ", title:"孫悟空の誕生日", desc:"国民的漫画「ドラゴンボール」の主人公・孫悟空の誕生日として公式に設定されている。" }],
  "1-17": [{ tag:"birthday", label:"誕生日", title:"モハメド・アリ (1942)", desc:"「私は最強だ」——ボクシングの枠を超え、世界に勇気を与えたレジェンド。" }],
  "2-3":  [{ tag:"culture", label:"文化", title:"節分", desc:"豆まきで鬼を追い払い、福を呼び込む日本の伝統行事。「鬼は外、福は内！」" }],
  "2-11": [{ tag:"birthday", label:"誕生日", title:"トーマス・エジソン (1847)", desc:"電球・蓄音機・映写機など1,000以上の発明を持つ「発明王」の誕生日。" }],
  "2-14": [{ tag:"culture", label:"文化", title:"バレンタインデー", desc:"愛と感謝を伝える日。日本では女性がチョコを渡す文化として定着。" }],
  "2-22": [{ tag:"culture", label:"文化", title:"猫の日", desc:"「ニャン（2）・ニャン（2）・ニャン（2）」の語呂合わせから生まれた、猫好きが世界中で猫を愛でる日。" }],
  "2-27": [{ tag:"anime", label:"アニメ・ゲーム", title:"ポケモンの日", desc:"1996年2月27日に「ポケットモンスター赤・緑」が発売された日。ポケモンデーとして世界中でファンが祝う。" }],
  "3-3":  [{ tag:"culture", label:"文化", title:"ひな祭り", desc:"女の子の健やかな成長を願う日本の伝統行事。ひな人形を飾り、ちらし寿司やひなあられを楽しむ。" }],
  "3-14": [{ tag:"birthday", label:"誕生日", title:"アルベルト・アインシュタイン (1879)", desc:"相対性理論で物理学を変えた天才。「想像力は知識よりも重要だ」という名言でも有名。" }, { tag:"culture", label:"文化", title:"ホワイトデー", desc:"バレンタインのお返しをする日。日本発祥の文化として定着している。" }],
  "3-15": [{ tag:"birthday", label:"誕生日", title:"渡辺直美 (1987)", desc:"日本を代表するコメディアン・タレント。ビヨンセのものまねで世界的に注目され、SNSでも大活躍中。" }],
  "3-20": [{ tag:"history", label:"歴史", title:"春分の日", desc:"昼と夜の長さがほぼ等しくなる日。「自然をたたえ、生物をいつくしむ日」として国民の祝日。" }],
  "4-1":  [{ tag:"culture", label:"文化", title:"エイプリルフール", desc:"うそをついてもいい日として世界中で楽しまれる。企業の遊び心あるジョーク発表も話題になる。" }],
  "4-5":  [{ tag:"birthday", label:"誕生日", title:"岡本太郎 (1911)", desc:"「芸術は爆発だ！」太陽の塔で有名な日本の前衛芸術家。破天荒な作品で日本のアート界に革命を起こした。" }],
  "4-22": [{ tag:"history", label:"歴史", title:"アースデイ（地球の日）", desc:"1970年から始まった地球環境について考える日。世界193カ国以上で様々なイベントが開催される。" }],
  "5-4":  [{ tag:"anime", label:"映画・アニメ", title:"スター・ウォーズの日", desc:"「May the 4th be with you（フォースと共にあれ）」の語呂合わせから生まれた、世界中のファンが祝う記念日。" }],
  "5-5":  [{ tag:"culture", label:"文化", title:"こどもの日", desc:"子どもたちの幸福を願う日本の祝日。鯉のぼりを立て、柏餅を食べる文化が定着している。" }],
  "6-1":  [{ tag:"birthday", label:"誕生日", title:"マリリン・モンロー (1926)", desc:"ハリウッド黄金時代を象徴する女優。今もなお世界中でアイコンとして愛されている。" }],
  "6-5":  [{ tag:"history", label:"歴史", title:"世界環境デー", desc:"1972年の国連人間環境会議を記念して制定。地球の環境保全について考え、行動する日。" }],
  "7-10": [{ tag:"birthday", label:"誕生日", title:"ニコラ・テスラ (1856)", desc:"交流電流システムを発明し、現代の電力インフラの礎を作った天才発明家・物理学者。" }],
  "7-20": [{ tag:"history", label:"歴史", title:"人類、月面に立つ (1969)", desc:"アポロ11号がニール・アームストロングを月面に着陸させた日。「これは人間にとって小さな一歩だが、人類にとっての大きな飛躍だ」" }],
  "8-1":  [{ tag:"birthday", label:"誕生日", title:"尾田栄一郎 (1975)", desc:"世界最多発行部数を誇る漫画『ONE PIECE』の作者。30年近く第一線で走り続ける漫画界のレジェンド。" }],
  "9-3":  [{ tag:"anime", label:"アニメ", title:"ドラえもんの誕生日 (2112年)", desc:"藤子・F・不二雄が生み出した国民的ロボット、ドラえもんの公式誕生日は2112年9月3日。未来からやってきた！" }],
  "9-19": [{ tag:"birthday", label:"誕生日", title:"高橋留美子 (1957)", desc:"「うる星やつら」「らんま1/2」「犬夜叉」など数々の名作を生み出した漫画界の巨匠。" }],
  "10-4": [{ tag:"culture", label:"文化", title:"世界動物の日", desc:"1931年に制定された、地球上のすべての動物に感謝し保護を考える日。" }],
  "10-9": [{ tag:"birthday", label:"誕生日", title:"ジョン・レノン (1940)", desc:"ビートルズのメンバーにして平和の象徴。「イマジン」は今も世界中で愛され続けている。" }],
  "11-3": [{ tag:"culture", label:"文化", title:"文化の日・ゴジラの日", desc:"1954年11月3日に映画「ゴジラ」第1作が公開。日本が誇る世界的モンスターの誕生日でもある。" }],
  "11-9": [{ tag:"history", label:"歴史", title:"ベルリンの壁崩壊 (1989)", desc:"冷戦の象徴だったベルリンの壁が崩壊した日。東西ドイツ統一へのドアが開いた歴史的な瞬間。" }],
  "12-10":[{ tag:"history", label:"歴史", title:"ノーベル賞授賞式", desc:"ダイナマイトを発明したノーベルの命日に合わせ、毎年ストックホルムで授賞式が行われる。" }],
  "12-25":[{ tag:"culture", label:"文化", title:"クリスマス", desc:"世界中で最も多くの人が祝う祝日。イエス・キリストの誕生を祝い、家族や友人と過ごす特別な日。" }],
};

const MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const today = new Date();
let cur = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = null;

function render() {
  const y = cur.getFullYear(), m = cur.getMonth();
  document.getElementById("month-title").textContent = y + "年 " + MONTHS[m];
  const daysEl = document.getElementById("days");
  daysEl.innerHTML = "";
  const first = new Date(y, m, 1).getDay();
  const total = new Date(y, m+1, 0).getDate();
  for (let i = 0; i < first; i++) {
    const e = document.createElement("div"); e.className = "day empty"; daysEl.appendChild(e);
  }
  for (let d = 1; d <= total; d++) {
    const key = (m+1) + "-" + d;
    const isToday = (y === today.getFullYear() && m === today.getMonth() && d === today.getDate());
    const hasEv = !!EVENTS[key];
    const isSel = selected && selected.y === y && selected.m === m && selected.d === d;
    const el = document.createElement("div");
    el.className = "day" + (isToday?" today":"") + (isSel?" selected":"");
    const evs = EVENTS[key];
    let dotsHtml = "";
    if (evs) {
      const shown = {};
      dotsHtml = '<div class="dot-wrap">';
      evs.forEach(ev => { if (!shown[ev.tag]) { dotsHtml += '<div class="dot dot-' + ev.tag + '"></div>'; shown[ev.tag] = true; } });
      dotsHtml += '</div>';
    }
    el.innerHTML = '<span class="day-num">' + d + '</span>' + dotsHtml;
    el.addEventListener("click", () => { selected = {y,m,d}; render(); showDetail(key, y, m+1, d); });
    daysEl.appendChild(el);
  }
  if (selected && selected.y === y && selected.m === m) {
    showDetail((m+1)+"-"+selected.d, y, m+1, selected.d);
  }
}

function showDetail(key, y, mo, d) {
  const det = document.getElementById("detail");
  const dateStr = y + "年" + mo + "月" + d + "日";
  const evs = EVENTS[key];
  if (!evs) { det.innerHTML = '<div class="detail-date">' + dateStr + '</div><div class="detail-empty">この日の記念日はまだ登録されていません。</div>'; return; }
  const tagMap = { birthday:"tag-birthday", history:"tag-history", anime:"tag-anime", culture:"tag-culture" };
  let html = '<div class="detail-date">' + dateStr + '</div>';
  evs.forEach(ev => {
    html += '<div class="event-item"><span class="event-tag ' + (tagMap[ev.tag]||"") + '">' + ev.label + '</span><div><div class="event-title">' + ev.title + '</div><div class="event-desc">' + ev.desc + '</div></div></div>';
  });
  det.innerHTML = html;
}

document.getElementById("prev").addEventListener("click", () => { cur.setMonth(cur.getMonth()-1); selected=null; render(); });
document.getElementById("next").addEventListener("click", () => { cur.setMonth(cur.getMonth()+1); selected=null; render(); });

selected = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };
render();
showDetail((today.getMonth()+1)+"-"+today.getDate(), today.getFullYear(), today.getMonth()+1, today.getDate());
</script>

</body>
</html>
