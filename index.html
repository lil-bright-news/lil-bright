<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>lil' bright — ポジティブニュースだけをあなたへ</title>
  <link rel="icon" href="images/faviconlogo.png" sizes="32x32">
  <link rel="icon" href="images/faviconlogo.png" sizes="48x48">
  <link rel="apple-touch-icon" href="images/faviconlogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #4caf50;
      --green-dark: #2e7d32;
      --green-light: #e8f5e9;
      --dark: #111111;
      --white: #ffffff;
      --muted: #6b7280;
      --bg: #f9fafb;
    }

    body {
      background: var(--bg);
      color: var(--dark);
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* ヘッダー */
    .site-header {
      background: var(--white);
      border-bottom: 1px solid #e5e7eb;
      padding: 0 40px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-header a {
      display: flex;
      align-items: center;
    }
    .site-header img {
      height: 72px;
    }

    /* ヒーローバナー */
    .hero {
      background: var(--dark);
      padding: 56px 24px 52px;
      text-align: center;
    }
    .hero-logo {
      height: 64px;
      margin-bottom: 24px;
    }
    .hero p {
      color: #d1d5db;
      font-size: 0.95rem;
      line-height: 2;
      max-width: 480px;
      margin: 0 auto;
    }
    .hero p strong {
      color: var(--green);
    }

    /* カテゴリバー */
    .category-bar {
      background: var(--green);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      height: 44px;
    }
    .category-bar span {
      font-family: 'Lexend', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--white);
      white-space: nowrap;
      padding: 4px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.4);
      cursor: pointer;
      transition: background 0.15s;
    }
    .category-bar span:hover,
    .category-bar span.active {
      background: var(--white);
      color: var(--green-dark);
    }

    /* メインコンテンツ */
    main {
      max-width: 900px;
      margin: 48px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-family: 'Lexend', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }

    /* ニュースカード */
    .news-item {
      display: flex;
      gap: 20px;
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      border: 1px solid #f0f0f0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .news-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.09);
    }
    .news-item img {
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      background: var(--green-light);
    }
    .news-item .text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .news-item .title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--dark);
    }
    .news-item .summary {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
    }
    .news-item .meta {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: #9ca3af;
      margin-top: auto;
      align-items: center;
    }
    .news-item .tag {
      background: var(--green-light);
      color: var(--green-dark);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 11px;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 40px 20px;
      font-size: 0.82rem;
      color: var(--muted);
      border-top: 1px solid #e5e7eb;
      margin-top: 40px;
    }
    footer a {
      color: var(--green-dark);
      text-decoration: none;
    }

    /* レスポンシブ */
    @media (max-width: 600px) {
      .news-item img { width: 110px; height: 80px; }
      .news-item .title { font-size: 15px; }
      .hero-logo { height: 48px; }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <a href="index.html">
      <img src="images/logo.png" alt="lil' bright">
    </a>
  </header>

  <!-- ヒーロー -->
  <div class="hero">
    <p>
      暗いニュースで溢れたこの時代に、<strong>ポジティブなニュースだけ</strong>を届けたい。<br>
      朝起きたとき。寝る前。ちょっと気分を上げたいとき。<br>
      lil' bright は、そんな瞬間のためのニュースサイトです。
    </p>
  </div>

  <!-- カテゴリバー -->
  <div class="category-bar">
    <span class="active">すべて</span>
    <span>🇯🇵 日本</span>
    <span>🌍 海外</span>
    <span>🔬 テクノロジー</span>
    <span>🎮 ゲーム</span>
    <span>🌿 環境</span>
    <span>🎨 文化・アート</span>
    <span>🐾 動物・自然</span>
  </div>

  <!-- 記事一覧 -->
  <main id="newsList">
    <div class="section-title">最新ニュース</div>
  </main>

  <footer>
    © 2026 lil' bright &nbsp;|&nbsp; <a href="#">プライバシーポリシー</a>
  </footer>

  <script>
    fetch('./articles.json')
      .then(response => response.json())
      .then(articles => {
        const newsList = document.getElementById('newsList');

        // 新しい順に並べ替え
        articles.reverse();

        articles.forEach(article => {
          const item = document.createElement('a');
          item.href = article.url;
          item.className = 'news-item';

          item.innerHTML = `
            <img src="${article.image}" alt="${article.alt}">
            <div class="text">
              <div class="title">${article.title}</div>
              <p class="summary">${article.summary}</p>
              <div class="meta">
                <span class="date">${article.date}</span>
                <span class="tag">${article.tag}</span>
              </div>
            </div>
          `;

          newsList.appendChild(item);
        });
      });

  </script>

</body>
</html>
